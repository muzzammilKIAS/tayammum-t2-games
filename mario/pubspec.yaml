name: umt3033_app
description: "Pengembaraan Tayammum — game platform soalan Tayammum Tingkatan 2 (DSKP KSSM SK 4.10)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4

  flame: ^1.38.2
  qr_flutter: ^4.1.0
  web: ^1.1.1
  web_socket_channel: ^3.0.2
  game_shared:
    path: packages/game_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-VariableFont.ttf

  assets:
    - assets/data/bank_tayammum.json
