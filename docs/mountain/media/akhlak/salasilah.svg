<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="Rajah salasilah keluarga: saudara lelaki ibu ditanda dengan tanda soal">
  <rect width="760" height="460" rx="28" fill="#faf8f1"/>
  <style>
    .box { fill: #fffdf8; stroke: #cfd6c7; stroke-width: 3; }
    .lbl { font: 700 22px 'DM Sans', Arial, sans-serif; fill: #173d34; text-anchor: middle; }
    .sub { font: 600 15px 'DM Sans', Arial, sans-serif; fill: #66756c; text-anchor: middle; }
    .ar  { font: 700 30px 'Amiri', 'Geeza Pro', 'Traditional Arabic', serif; fill: #143f36; text-anchor: middle; }
    .ln  { stroke: #6f9a86; stroke-width: 4; fill: none; }
  </style>
  <!-- Generasi datuk nenek -->
  <rect class="box" x="70" y="36" width="250" height="64" rx="16"/>
  <text class="lbl" x="195" y="66">Datuk &amp; Nenek</text><text class="sub" x="195" y="88">sebelah ayah</text>
  <rect class="box" x="440" y="36" width="250" height="64" rx="16"/>
  <text class="lbl" x="565" y="66">Datuk &amp; Nenek</text><text class="sub" x="565" y="88">sebelah ibu</text>
  <!-- garisan anak -->
  <path class="ln" d="M195 100v40M110 140h170M110 140v30M280 140v30"/>
  <path class="ln" d="M565 100v40M480 140h170M480 140v30M650 140v30"/>
  <!-- Generasi ibu bapa -->
  <rect class="box" x="40" y="170" width="140" height="70" rx="16"/>
  <text class="ar" x="110" y="214">الْعَمُّ</text>
  <rect class="box" x="210" y="170" width="140" height="70" rx="16" style="fill:#e3ece4"/>
  <text class="lbl" x="280" y="212">Ayah</text>
  <rect class="box" x="410" y="170" width="140" height="70" rx="16" style="fill:#e3ece4"/>
  <text class="lbl" x="480" y="212">Ibu</text>
  <rect x="580" y="170" width="140" height="70" rx="16" fill="#fbefd2" stroke="#c78f2c" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="650" y="222" style="font: 800 46px 'DM Sans', Arial, sans-serif; fill: #c78f2c; text-anchor: middle">?</text>
  <!-- perkahwinan & anak -->
  <path class="ln" d="M350 205h60"/>
  <circle cx="380" cy="205" r="7" fill="#e2ae4c"/>
  <path class="ln" d="M380 212v108"/>
  <rect class="box" x="300" y="320" width="160" height="76" rx="18" style="fill:#143f36;stroke:#143f36"/>
  <text x="380" y="368" style="font: 800 26px 'DM Sans', Arial, sans-serif; fill: #f4e6b8; text-anchor: middle">Saya</text>
</svg>
